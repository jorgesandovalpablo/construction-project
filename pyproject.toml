[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-project"
version = "0.1.0"
description = "Prediccion de costos de equipos de construccion"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "fastapi",
    "uvicorn",
    "pydantic",
    "ipykernel",
    "matplotlib",
    "seaborn",
    "Jinja2",
    "statsmodels"
]
