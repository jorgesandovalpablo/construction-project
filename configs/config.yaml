project:
  name: "construction-project"
  seed: 21
  version: "0.1.0"

paths:
  data_raw: "data/raw/"
  data_processed: "data/processed/features.parquet"
  data_predictions: "data/predictions/"
  models: "models/"

data:
  target1: "Price_Equipo1"
  target2: "Price_Equipo2"
  date_col: "Date"
  n_series: 5
  date_start: "2010-01-04"
  date_end: "2023-08-31"
  group_cols:
    - "Price_x"
    - "Price_Y"
    - "Price_Z"

model:
  horizon: 30
  params_lgbm_diario:
    n_estimators: 1500
    learning_rate: 0.05
    objective: "regression_l1"
    metric: "mae"
    num_leaves: 63
    max_bin: 255
    min_data_in_leaf: 20
    lambda_l1: 0.1
    lambda_l2: 0.2
    random_state: 21
    n_jobs: -1
    verbosity: -1


features:
  holiday_impact:
    positive:
      - "Navidad"
      - "Dia de la Madre"
      - "Carnaval"
      - "Dia del Trabajo"
      - "Independencia de Cuenca"
      - "Fundacion de Quito"
      - "Mundial"
      - "Dia de Difuntos"
    negative:
      - "Primer dia del ano"
      - "Traslado"
      - "Black Friday"
      - "Cyber Monday"
      - "Puente"
      - "Recupero"
    atypical:
      - "Terremoto"

lags:
  max_lag: 365
  max_rolling: 90

training:
  test_size_weeks: 8
  n_folds: 5
  weight_value: 5

